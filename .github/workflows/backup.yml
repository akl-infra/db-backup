# Nightly akldb SNAPSHOT as a git commit (decided 2026-09-13: "we don't need
# releases as long as there is a nightly commit on a public repo" and "back up
# the layout records, likes, etc. -- snapshot, not full reconstruction").
# Fetches /v1/dump/latest.json from the public API, downloads the gzip it
# names, verifies the sha256 it declares, then keeps only the current state
# -- records, layout_formats, likes, authors, admins, bans, clients,
# import_map, meta -- and drops the event log, the revision history and the
# caches. Committed as canonical JSON so git delta-compresses night to night.
# A night with no change commits nothing.
name: backup

on:
  schedule:
    - cron: "30 4 * * *" # 04:30 UTC daily, after akldb's own 04:00 dump job
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch, verify, decompress
        env:
          API: https://api.akldb.org
        run: |
          set -eu
          curl -fsS "$API/v1/dump/latest.json" -o latest.json
          key=$(jq -r .key latest.json); sha=$(jq -r .sha256 latest.json)
          curl -fsS "$API/v1/dump/$key" -o dump.json.gz
          echo "$sha  dump.json.gz" | sha256sum -c -
          gunzip -c dump.json.gz \
            | jq -S --indent 1 'del(.events, .layout_revs, .auth_cache, .import_state, .link_submissions)' \
            > snapshot.json
          jq '{date, seq, layout_count, source_sha256: .sha256, source_key: .key}' latest.json > manifest.json
          rm -f dump.json.gz latest.json
      - name: Commit if changed
        run: |
          set -eu
          git add snapshot.json manifest.json
          if git diff --cached --quiet; then echo "no change tonight"; exit 0; fi
          git -c user.name=akldb-backup[bot] -c user.email=actions@github.com \
            commit -m "snapshot $(jq -r .date manifest.json): seq $(jq -r .seq manifest.json), $(jq -r .layout_count manifest.json) layouts"
          git push
